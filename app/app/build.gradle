plugins {
    id 'com.android.application'
}

def ver = new Properties()
file('../../version.properties').withInputStream { ver.load(it) }
def local = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { local.load(it) }

android {
    compileSdk = 34
    defaultConfig {
        applicationId = "com.heryts.setloc"
        minSdk = 33
        targetSdk = 33
        versionCode = ver['versionCode'] as int
        versionName = ver['versionName']
        manifestPlaceholders = [MAPS_API_KEY: local.getProperty('MAPS_API_KEY', 'DEFAULT_API_KEY')]
    }

    def ksFile = rootProject.file('keystore.properties')
    def ksProps = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            signingConfig = ksFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        localeFilters += ["en", "in", "id"]
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        resources {
            excludes += ['/kotlin/**', '/META-INF/*.version', '/META-INF/{AL2.0,LGPL2.1}', '/META-INF/*.kotlin_module', '/DebugProbesKt.bin', '/kotlin-tooling-metadata.json']
        }
    }
    namespace = 'com.heryts.setloc'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll('-Xno-param-assertions', '-Xno-call-assertions', '-Xno-receiver-assertions')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

}
