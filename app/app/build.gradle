plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
}

def tagName = '3.27'

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.heryts.setloc"
        minSdk 27
        targetSdk 33
        versionCode 327
        versionName tagName
    }

    // Key rilis dari app/keystore.properties; bila tidak ada, pakai key debug.
    def ksFile = rootProject.file('keystore.properties')
    def ksProps = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.heryts.setloc'
    buildToolsVersion '33.0.0'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0-alpha01'
    implementation 'com.google.android.material:material:1.9.0-alpha01'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'androidx.preference:preference:1.2.0'

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.0-alpha04"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.0-alpha04"

    implementation "com.google.dagger:hilt-android:2.48"
    ksp "com.google.dagger:hilt-compiler:2.48"

    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.room:room-ktx:2.5.0'
    ksp 'androidx.room:room-compiler:2.5.0'

    implementation ("dev.rikka.rikkax.material:material-preference:2.0.0") {
        exclude group: "dev.rikka.rikkax.appcompat", module: "appcompat"
    }
}

// Hilt 2.48 membawa kotlin-stdlib 1.9.0, sedangkan plugin Kotlin 1.8.0 dan lint AGP 7.4
// (Kotlin 1.7.1) tidak bisa membaca metadata 1.9. Samakan stdlib dengan versi plugin.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-common', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.8.0'
        }
    }
}

// Samakan jvmTarget semua task Kotlin (termasuk task KSP).
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '11'
}
