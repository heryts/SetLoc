name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Baca versi
        id: ver
        run: echo "name=$(sed -n 's/^versionName=//p' version.properties)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: sh build-all.sh

      - name: Siapkan zip
        run: cp module/zygote/build/outputs/magisk/release/SetLocZygisk-release.zip "SetLocZygisk-v${{ steps.ver.outputs.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: SetLocZygisk-v${{ steps.ver.outputs.name }}.zip
          archive: false
          if-no-files-found: error

      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: SetLoc Zygisk v${{ steps.ver.outputs.name }}
          files: SetLocZygisk-v${{ steps.ver.outputs.name }}.zip
          target_commitish: ${{ github.sha }}
