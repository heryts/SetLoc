org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true

# Initial packages baked into the module zip (optional, may be empty).
# Packages can also be added/removed at runtime: gpsz.sh pkg add <package>
gpsz.packages=

# AGP 8.13.2 belum diuji untuk compileSdk 37; hanya membungkam peringatan.
android.suppressUnsupportedCompileSdk=37.0
