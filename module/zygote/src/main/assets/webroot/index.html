<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f9ff" id="theme-color">
<title>SetLoc Zygisk</title>
<link rel="stylesheet" href="https://mui.kernelsu.org/internal/insets.css">
<script>
  // Terapkan tema sebelum render supaya tidak berkedip
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('gpsz_theme') || 'system'; } catch (e) {}
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
<style>
:root {
  --primary: #0ea5e9;
  --accent: #a855f7;
  --bg: #f9fafb;
  --card: #ffffff;
  --text: #1f2937;
  --text2: #6b7280;
  --border: #e5e7eb;
  --shadow: rgba(0,0,0,.06);
  --ok: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --chip: #eef2f7;
  --inset-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --inset-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --inset-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  --inset-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
}
.dark {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f3f4f6;
  --text2: #94a3b8;
  --border: #334155;
  --shadow: rgba(0,0,0,.4);
  --chip: #263449;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); color-scheme: light; }
.dark html, html.dark, html.dark body { color-scheme: dark; }
body {
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.4;
  padding-left: var(--inset-left); padding-right: var(--inset-right);
  min-height: 100vh;
  transition: background-color .3s, color .3s;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }

/* ---------- Header ---------- */
.hero {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: #fff;
  padding: calc(var(--inset-top) + 16px) 16px 56px;
  border-radius: 0 0 28px 28px;
  position: relative;
}
.hero-row { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 42px; height: 42px; border-radius: 14px;
  background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none;
}
.hero h1 { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
.hero p { font-size: 12.5px; opacity: .85; }
.hero .grow { flex: 1; min-width: 0; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.18); color: #fff; flex: none;
}
.icon-btn:active { background: rgba(255,255,255,.3); }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Cards ---------- */
.wrap { padding: 0 14px calc(var(--inset-bottom) + 28px); max-width: 720px; margin: 0 auto; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 2px 10px var(--shadow);
}
.status { margin-top: -38px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; position: relative; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text2); flex: none; box-shadow: 0 0 0 4px rgba(148,163,184,.2); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(34,197,94,.22); }
.status .t { font-weight: 600; }
.status .s { font-size: 12.5px; color: var(--text2); word-break: break-all; }

.appcard { margin-top: 10px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.appcard .t { font-weight: 600; }
.appcard .s { font-size: 12.5px; color: var(--text2); }
.appcard .btn { flex: none; }
.appcard .grow, .status .grow { flex: 1; }
.status .btn { flex: none; min-width: 74px; }
.btn.stop { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .55; }
.banner {
  margin-top: 10px; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5;
  background: rgba(245,158,11,.14); color: #b45309; border: 1px solid rgba(245,158,11,.35);
}
.dark .banner { color: #fbbf24; }
.banner.danger { background: rgba(239,68,68,.12); color: #b91c1c; border-color: rgba(239,68,68,.35); }
.dark .banner.danger { color: #fca5a5; }
.banner .mono { line-height: 1.4; }
.banner .mono.block { display: block; margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.14); }
.dark .banner .mono.block { background: rgba(0,0,0,.28); }
.banner .btn-reboot {
  display: block; width: 100%; margin-top: 12px; padding: 10px 16px; border-radius: 12px;
  background: var(--danger); color: #fff; font-weight: 600; font-size: 14px; text-align: center;
  box-shadow: 0 2px 6px rgba(239,68,68,.35);
}
.banner .btn-reboot:active { filter: brightness(.9); }

/* ---------- Toolbar ---------- */
.toolbar { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 46px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
}
.search svg { color: var(--text2); width: 20px; height: 20px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
.search input::placeholder { color: var(--text2); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  padding: 7px 14px; border-radius: 999px; background: var(--chip); color: var(--text2);
  font-size: 13.5px; white-space: nowrap; border: 1px solid transparent; transition: all .15s;
}
.chip:focus, .chip:focus-visible { outline: 0; }
.chip.active, .chip.ghost.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border-color: transparent; }
.count { margin: 14px 4px 8px; font-size: 13px; color: var(--text2); display: flex; justify-content: space-between; }

/* ---------- App list ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  transition: border-color .2s, box-shadow .2s;
}
.row.on { border-color: rgba(14,165,233,.55); box-shadow: 0 2px 12px rgba(14,165,233,.12); }
.avatar {
  width: 44px; height: 44px; border-radius: 12px; flex: none; overflow: hidden; position: relative;
  display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 18px;
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: var(--card); }
.meta { flex: 1; min-width: 0; }
.name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pkg { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; background: var(--chip); color: var(--text2); }
.tag.warn { background: rgba(245,158,11,.18); color: #b45309; }
.dark .tag.warn { color: #fbbf24; }

.switch {
  width: 50px; height: 30px; border-radius: 999px; background: #cbd5e1; position: relative; flex: none;
  transition: background .2s; border: 0;
}
.dark .switch { background: #475569; }
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s;
}
.switch[aria-checked="true"] { background: linear-gradient(135deg, var(--primary), var(--accent)); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch[disabled] { opacity: .5; }

.empty { text-align: center; color: var(--text2); padding: 40px 10px; }
.skel { height: 64px; border-radius: 16px; background: linear-gradient(90deg, var(--chip) 25%, var(--border) 37%, var(--chip) 63%); background-size: 400% 100%; animation: sh 1.3s infinite; }
@keyframes sh { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

.foot { margin: 18px 6px 0; font-size: 12px; color: var(--text2); text-align: center; }

/* ---------- Sheet & toast ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card);
  border-radius: 24px 24px 0 0; padding: 10px 18px calc(var(--inset-bottom) + 20px);
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  max-width: 720px; margin: 0 auto; max-height: 85vh; overflow-y: auto;
}
.sheet.show { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 0 auto 14px; }
.sheet h2 { font-size: 17px; margin-bottom: 12px; }
.set { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.set:first-of-type { border-top: 0; }
.set .grow { flex: 1; min-width: 0; }
.set .d { font-size: 12.5px; color: var(--text2); margin-top: 2px; }
.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { padding: 6px 11px; border-radius: 9px; font-size: 13px; color: var(--text2); }
.seg button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px var(--shadow); }
.btn { padding: 10px 16px; border-radius: 12px; background: var(--chip); font-weight: 500; }
.btn.primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; word-break: break-all; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--inset-bottom) + 24px); transform: translate(-50%, 30px);
  background: #111827; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
  opacity: 0; transition: all .25s; z-index: 30; max-width: 90vw; text-align: center; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #b91c1c; }
</style>
</head>

<div class="hero">
  <div class="hero-row">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg>
    </div>
    <div class="grow">
      <h1>SetLoc</h1>
      <p>Pilih app yang di-hook · Zygisk</p>
    </div>
    <button class="icon-btn" id="btnReload" aria-label="Muat ulang">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

</div>

<div class="wrap">
  <div class="card status">
    <div class="dot" id="dot"></div>
    <div class="grow" style="min-width:0">
      <div class="t" id="stTitle">Memuat…</div>
      <div class="s" id="stSub">Titik lokasi diatur lewat aplikasi SetLoc</div>

  <div class="card appcard">
    <div class="grow" style="min-width:0">
      <div class="t">App SetLoc</div>

  </div>

  <div id="banners"></div>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Cari nama app atau package" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <div class="chips">
      <button class="chip active" data-tab="all">Semua</button>
      <button class="chip" data-tab="hooked">Di-hook</button>

  <div class="count"><span id="cnt"></span><span id="modeTag"></span></div>

</div>

<div class="scrim" id="scrim"></div>

  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* =====================================================================
 *  Konfigurasi modul
 *  - ZygoteLoader membaca  $MODDIR/packages/<package>  setiap app start.
 *  - Aturan: app di-hook  <=>  (file <package> ada)  XOR  (file .all ada)
 *    -> tanpa .all : file = app yang DI-HOOK
 *    -> dengan .all: file = app yang DIKECUALIKAN
 * ===================================================================== */
const MODID  = 'setloc_zygisk';
const MODDIR = '/data/adb/modules/' + MODID;
const PKGDIR = MODDIR + '/packages';
const CFG_KEY = 'gpsz_cfg';          // dibaca saja (diisi oleh app SetLoc lewat bridge.sh)
const APP_PKG = 'com.heryts.setloc';

// Jangan force-stop paket ini (bisa membunuh sistem / manager yang sedang menjalankan WebUI)
const NO_STOP = new Set([
  'android', 'system', 'com.android.systemui', 'com.android.phone',
  'me.weishu.kernelsu', 'com.rifsxd.ksunext', 'me.bmax.apatch', 'com.topjohnwu.magisk',
  'com.dergoogler.mmrl', 'io.github.a13e300.ksuwebui', 'com.dergoogler.mmrl.wx'
]);

const PKG_RE = /^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)+$/;   // nama paket valid (cegah shell-injection)

/* ----------------------------- Backend ------------------------------ */
const hasKsu = typeof ksu !== 'undefined';
let _cb = 0;
function exec(cmd) {
  return new Promise((resolve, reject) => {
    const name = 'exec_callback_' + Date.now() + '_' + (_cb++);
    window[name] = (errno, stdout, stderr) => { delete window[name]; resolve({ errno, stdout, stderr }); };
    try { ksu.exec(cmd, '{}', name); } catch (e) { delete window[name]; reject(e); }
  });
}
async function sh(cmd) {
  const r = await exec(cmd);
  if (r.errno !== 0) throw new Error((r.stderr || '').trim() || ('exit ' + r.errno));
  return r.stdout || '';
}

const Real = {
  async readState() {
    const out = await sh(`mkdir -p '${PKGDIR}'; ls -1A '${PKGDIR}' 2>/dev/null; true`);
    const files = out.split('\n').map(s => s.trim()).filter(Boolean);
    return { all: files.includes('.all'), files: files.filter(f => f[0] !== '.' && f !== 'android') };
  },
  async readSys() {
    // system-wide aktif bila file packages/android ada DAN gpsz_sys=1
    try {
      const out = await sh(`[ -e '${PKGDIR}/android' ] && echo f=1; echo s=$(settings get global gpsz_sys 2>/dev/null)`);
      return /f=1/.test(out) && /s=1/.test(out);
    } catch (e) { return false; }
  },
  async setSys(on) {
    if (on) await sh(`mkdir -p '${PKGDIR}' && : > '${PKGDIR}/android' && settings put global gpsz_sys 1`);
    else await sh(`rm -f '${PKGDIR}/android'; settings put global gpsz_sys 0`);
  },
  async reboot() { await exec('svc power reboot || reboot'); },
  async setSpoof(on) {
    // gpsz.sh on|off mengubah enabled= di gpsz_cfg; titik lat/lng tetap. Daemon bridge tidak menimpa
    // sampai pengaturan di app SetLoc benar-benar diubah.
    await sh(`sh '${MODDIR}/gpsz.sh' ${on ? 'on' : 'off'} 2>&1`);
  },
  async readCfg() {
    // sync = salin pengaturan terbaru dari app SetLoc (no-op bila tidak ada perubahan), lalu baca nilai akhir
    try { return await sh(`sh '${MODDIR}/bridge.sh' sync >/dev/null 2>&1; settings get global ${CFG_KEY}`); } catch (e) { return ''; }
  },
  async ensureDaemon() {
    const r = await exec(`sh '${MODDIR}/bridge.sh' ensure 2>&1`);
    return /daemon=running/.test(r.stdout || '');
  },
  async listPkgs(type) {
    if (typeof ksu.listPackages === 'function') {
      try { return JSON.parse(ksu.listPackages(type)); } catch (e) { /* fallback ke pm */ }
    }
    const flag = type === 'system' ? '-s' : '-3';
    const out = await sh(`pm list packages ${flag}`);
    return out.split('\n').map(l => l.trim()).filter(l => l.startsWith('package:')).map(l => l.slice(8));
  },
  async info(pkgs) {
    const map = {};
    if (typeof ksu.getPackagesInfo !== 'function') return map;
    for (let i = 0; i < pkgs.length; i += 120) {
      try {
        const arr = JSON.parse(ksu.getPackagesInfo(JSON.stringify(pkgs.slice(i, i + 120))));
        for (const it of (Array.isArray(arr) ? arr : [arr])) if (it && it.packageName) map[it.packageName] = it;
      } catch (e) { /* label jatuh ke nama paket */ }
      await new Promise(r => setTimeout(r, 0));
    }
    return map;
  },
  async setFile(pkg, present) {
    if (present) await sh(`mkdir -p '${PKGDIR}' && : > '${PKGDIR}/${pkg}'`);
    else await sh(`rm -f '${PKGDIR}/${pkg}'`);
  },
  async setAll(on) {
    if (on) await sh(`mkdir -p '${PKGDIR}' && : > '${PKGDIR}/.all'`);
    else await sh(`rm -f '${PKGDIR}/.all'`);
  },
  async stop(pkg) { await exec(`am force-stop '${pkg}' >/dev/null 2>&1; true`); },
  async isInstalled() { const r = await exec(`test -d '${MODDIR}'`); return r.errno === 0; },
  async appInstalled() { const r = await exec(`pm path ${APP_PKG} 2>/dev/null`); return /^package:/m.test(r.stdout || ''); },
  async launch() {
    await sh(`am start --user 0 -n ${APP_PKG}/${APP_PKG}.ui.MapActivity >/dev/null 2>&1 || monkey -p ${APP_PKG} -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1`);
  },
  async installApp() {
    const r = await exec(`sh '${MODDIR}/bridge.sh' install 2>&1`);
    if (r.errno !== 0 || !/Success/.test(r.stdout || '')) throw new Error(((r.stdout || '') + (r.stderr || '')).trim().split('\n').pop() || 'pm install gagal');
  }
};

/* Mock untuk pratinjau di browser biasa (tanpa KernelSU) */
const Mock = (() => {
  const user = [
    ['com.google.android.apps.maps', 'Maps'], ['com.whatsapp', 'WhatsApp'], ['com.instagram.android', 'Instagram'],
    ['com.gojek.app', 'Gojek'], ['com.grabtaxi.passenger', 'Grab'], ['com.shopee.id', 'Shopee'],
    ['com.tokopedia.tkpd', 'Tokopedia'], ['com.telegram.messenger', 'Telegram'], ['com.spotify.music', 'Spotify'],
    ['com.android.chrome', 'Chrome'], ['id.dana', 'DANA'], ['com.traveloka.android', 'Traveloka'],
    ['org.mozilla.firefox', 'Firefox'], ['com.discord', 'Discord']
  ];
  const sys = [['com.android.settings', 'Settings'], ['com.google.android.gms', 'Google Play services'], ['com.android.vending', 'Google Play Store']];
  let files = ['com.google.android.apps.maps', 'com.gojek.app'], all = false, appOn = false, sys_ = false, cfgOn = true;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  return {
    async readState() { await wait(350); return { all, files: files.slice() }; },
    async readCfg() { return `enabled=${cfgOn ? 1 : 0};lat=-7.7956;lng=110.3695;acc=10;random=0`; },
    async ensureDaemon() { return true; },
    async listPkgs(t) { return (t === 'system' ? sys : user).map(x => x[0]); },
    async info(p) { const m = {}; user.concat(sys).forEach(([k, v]) => { m[k] = { packageName: k, appLabel: v }; }); return m; },
    async setFile(p, present) { await wait(150); files = files.filter(x => x !== p); if (present) files.push(p); },
    async setAll(on) { await wait(150); all = on; },
    async readSys() { return sys_; },
    async setSys(on) { await wait(150); sys_ = on; },
    async reboot() { await wait(200); },
    async setSpoof(on) { await wait(200); cfgOn = on; },
    async stop() {},
    async isInstalled() { return true; },
    async appInstalled() { return appOn; },
    async launch() { await wait(200); },
    async installApp() { await wait(900); appOn = true; }
  };
})();
const B = hasKsu ? Real : Mock;

/* ------------------------------ State ------------------------------- */
const S = {
  apps: [],            // {pkg,label,system,installed}
  files: new Set(),
  all: false,
  sys: false,          // hook system_server (system-wide)
  tab: 'all',
  showSys: false,
  q: '',
  order: new Map(),    // urutan awal (di-hook paling atas), stabil sampai muat ulang
  busy: new Set(),
  appOn: null,
  appBusy: false,
  spoofOn: false, spoofHas: false, spoofBusy: false,
  daemon: null         // true/false = daemon sinkron app->gpsz_cfg hidup/mati; null = belum diketahui
};
try { S.showSys = localStorage.getItem('gpsz_showsys') === '1'; } catch (e) {}

const hooked = pkg => S.all ? !S.files.has(pkg) : S.files.has(pkg);

/* ------------------------------ Helpers ----------------------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function hue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function guessLabel(pkg) {
  const p = pkg.split('.'); let l = p[p.length - 1];
  if (['android', 'app', 'apps', 'mobile', 'client', 'main'].includes(l) && p.length > 1) l = p[p.length - 2];
  return l.charAt(0).toUpperCase() + l.slice(1);
}

/* ------------------------------ Render ------------------------------ */
function visible() {
  const q = S.q.trim().toLowerCase();
  return S.apps.filter(a => {
    const on = hooked(a.pkg);
    if (S.tab === 'hooked' && !on) return false;
    if (a.system && !S.showSys && !on) return false;
    if (q && !(a.label.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => (S.order.get(a.pkg) - S.order.get(b.pkg)));
}

function rowHtml(a) {
  const on = hooked(a.pkg);
  const letter = esc((a.label || '?').trim().charAt(0).toUpperCase() || '?');
  const bg = `hsl(${hue(a.pkg)} 55% 52%)`;
  const img = hasKsu && a.installed ? `<img loading="lazy" alt="" src="ksu://icon/${esc(a.pkg)}" onerror="this.remove()">` : '';
  const tags = (a.system ? '<span class="tag">sistem</span>' : '') + (!a.installed ? '<span class="tag warn">tidak terpasang</span>' : '');
  return `<div class="row${on ? ' on' : ''}" data-pkg="${esc(a.pkg)}">
    <div class="avatar" style="background:${bg}">${letter}${img}</div>
    <div class="meta"><div class="name">${esc(a.label)}${tags}</div><div class="pkg">${esc(a.pkg)}</div></div>
    <button class="switch" role="switch" aria-checked="${on}" aria-label="Hook ${esc(a.label)}"${S.busy.has(a.pkg) ? ' disabled' : ''}></button>
  </div>`;
}

function render() {
  const list = visible();
  const total = S.apps.filter(a => hooked(a.pkg)).length;
  $('#cnt').textContent = S.all ? `${S.apps.length - S.files.size} app di-hook (mode semua)` : `${total} app di-hook`;
  $('#modeTag').textContent = S.all ? 'Mode: semua app' : '';
  $('#chipSys').classList.toggle('active', S.showSys);
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === S.tab));
  $('#list').innerHTML = list.length
    ? list.map(rowHtml).join('')
    : `<div class="empty">${S.q ? 'Tidak ada app yang cocok.' : (S.tab === 'hooked' ? 'Belum ada app yang di-hook.' : 'Daftar app kosong.')}</div>`;
}

function renderBanners() {
  const b = [];
  if (!hasKsu) b.push('<div class="banner">Mode pratinjau: WebUI dibuka di luar KernelSU / APatch / manager WebUI, jadi data di bawah hanya contoh dan tidak mengubah apa pun.</div>');
  if (S.all) b.push('<div class="banner danger"><b>Mode semua app aktif.</b> Hook masuk ke semua app kecuali yang dimatikan di daftar. Matikan di Pengaturan bila tidak sengaja.</div>');
  if (S.sys) b.push('<div class="banner danger"><b>System-wide aktif.</b> Berlaku untuk semua app setelah reboot.<button class="btn-reboot" id="btnReboot">Reboot sekarang</button></div>');
  if (S.daemon === false) b.push('<div class="banner danger">Daemon sinkronisasi (app SetLoc → modul) tidak berjalan, jadi tombol Start/Stop di app belum terbaca modul. Tekan muat ulang; bila tetap gagal, lihat <span class="mono">' + esc(MODDIR) + '/bridge.log</span>.</div>');
  if (S.missing) b.push('<div class="banner danger">Folder modul tidak ditemukan di ' + esc(MODDIR) + '. Pastikan id modul = <b>' + MODID + '</b> dan sudah reboot setelah flash.</div>');
  $('#banners').innerHTML = b.join('');
}

function renderApp() {
  const b = $('#btnApp');
  b.disabled = S.appBusy || S.appOn === null;
  if (S.appOn === null) { b.textContent = '…'; $('#appSub').textContent = 'Memeriksa…'; return; }
  b.textContent = S.appBusy ? 'Memasang…' : (S.appOn ? 'Buka' : 'Pasang app');
  $('#appSub').textContent = S.appOn ? 'Terpasang · atur titik lokasi di sini' : 'Belum terpasang di perangkat ini';
}

function renderStatus(raw) {
  const cfg = {};
  String(raw || '').trim().split(';').forEach(kv => { const i = kv.indexOf('='); if (i > 0) cfg[kv.slice(0, i)] = kv.slice(i + 1); });
  const has = 'enabled' in cfg;
  const on = cfg.enabled === '1';
  $('#dot').classList.toggle('on', on);
  S.spoofOn = on; S.spoofHas = has && !!cfg.lat && !!cfg.lng;
  const sb = $('#btnSpoof');
  sb.textContent = S.spoofBusy ? '…' : (on ? 'Stop' : 'Start');
  sb.classList.toggle('stop', on); sb.classList.toggle('primary', !on);
  sb.disabled = S.spoofBusy || !S.spoofHas;
  $('#stTitle').textContent = !has ? 'Belum ada titik diatur' : (on ? 'Spoof lokasi aktif' : 'Spoof lokasi nonaktif');
  $('#stSub').textContent = has && cfg.lat && cfg.lng
    ? `${cfg.lat}, ${cfg.lng} · atur titik lewat aplikasi SetLoc`
    : 'Titik lokasi diatur lewat aplikasi SetLoc';
}

/* ------------------------------- Load -------------------------------- */
async function load() {
  $('#list').innerHTML = '<div class="skel"></div>'.repeat(7).replace(/<\/div>/g, '</div>');
  $('#list').style.gap = '8px';
  try {
    S.missing = hasKsu ? !(await B.isInstalled()) : false;
    S.daemon = hasKsu ? await B.ensureDaemon().catch(() => null) : true;
    const [st, cfg, user, sys, sysOn] = await Promise.all([
      B.readState(), B.readCfg(),
      B.listPkgs('user').catch(() => []), B.listPkgs('system').catch(() => []),
      B.readSys().catch(() => false)
    ]);
    S.all = st.all; S.sys = sysOn; S.files = new Set(st.files);
    renderStatus(cfg);
    S.appOn = await B.appInstalled().catch(() => null);
    renderApp();

    const sysSet = new Set(sys);
    const names = Array.from(new Set([...user, ...sys, ...st.files])).filter(p => p !== 'android'); // 'android' = system_server, diatur lewat saklar System-wide
    const info = await B.info(names);
    const installed = new Set([...user, ...sys]);
    S.apps = names.map(pkg => ({
      pkg,
      label: (info[pkg] && info[pkg].appLabel) || guessLabel(pkg),
      system: sysSet.has(pkg),
      installed: installed.has(pkg)
    }));

    // urutan awal: di-hook dulu, lalu A-Z (stabil sampai muat ulang)
    S.apps.sort((a, b) => (hooked(b.pkg) - hooked(a.pkg)) || a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }));
    S.order = new Map(S.apps.map((a, i) => [a.pkg, i]));
  } catch (e) {
    toast('Gagal memuat: ' + e.message, true);
  }
  renderBanners();
  render();
}

/* ------------------------------ Actions ------------------------------ */
async function toggle(pkg) {
  if (!PKG_RE.test(pkg)) return toast('Nama paket tidak valid', true);
  if (S.busy.has(pkg)) return;
  const wasOn = hooked(pkg);
  const wantFile = S.all ? wasOn : !wasOn;      // file ada = di-hook (normal) / dikecualikan (mode semua)
  S.busy.add(pkg);
  try {
    await B.setFile(pkg, wantFile);
    if (wantFile) S.files.add(pkg); else S.files.delete(pkg);
    const protectedPkg = NO_STOP.has(pkg);
    if (!protectedPkg) await B.stop(pkg);
    const a = S.apps.find(x => x.pkg === pkg);
    toast(`${a ? a.label : pkg}: hook ${wasOn ? 'dimatikan' : 'diaktifkan'}` +
      (protectedPkg ? ' — app sistem ini tidak dihentikan otomatis, reboot / paksa-henti manual agar berlaku' : ''));
  } catch (e) {
    toast('Gagal: ' + e.message, true);
  } finally {
    S.busy.delete(pkg);
    render();
  }
}

async function appAction() {
  if (S.appBusy) return;
  if (S.appOn) {
    try { await B.launch(); } catch (e) { toast('Gagal membuka app: ' + e.message, true); }
    return;
  }
  S.appBusy = true; renderApp();
  try {
    await B.installApp();
    S.appOn = true;
    toast('SetLoc terpasang');
  } catch (e) { toast('Gagal memasang: ' + e.message, true); }
  S.appBusy = false; renderApp();
}

async function setAllMode(on) {
  try {
    await B.setAll(on);
    S.all = on;
    toast(on ? 'Mode semua app diaktifkan' : 'Mode semua app dimatikan');
  } catch (e) { toast('Gagal: ' + e.message, true); }
  renderBanners(); render(); openSheet();
}

async function setSysMode(on) {
  try {
    await B.setSys(on);
    S.sys = on;
    toast(on ? 'System-wide aktif. Reboot untuk menerapkan' : 'System-wide mati. Reboot untuk menerapkan');
  } catch (e) { toast('Gagal: ' + e.message, true); }
  renderBanners(); openSheet();
}

/* ------------------------------ Sheet UI ------------------------------ */
function theme() { try { return localStorage.getItem('gpsz_theme') || 'system'; } catch (e) { return 'system'; } }
function applyTheme(t) {
  try { localStorage.setItem('gpsz_theme', t); } catch (e) {}
  const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  $('#theme-color').content = dark ? '#1a2538' : '#f2f9ff';
}
function showSheet(html) { $('#sheetBody').innerHTML = html; $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); }
function closeSheet() { $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); }

function openSheet() {
  const t = theme();
  showSheet(`
    <h2>Pengaturan</h2>
    <div class="set">
      <div class="grow"><div>Tema</div></div>
      <div class="seg" id="segTheme">
        ${[['system', 'Sistem'], ['light', 'Terang'], ['dark', 'Gelap']].map(([k, v]) => `<button data-th="${k}" class="${t === k ? 'active' : ''}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="set">
      <div class="grow">
        <div>Hook semua app</div>
        <div class="d">Semua app ikut di-hook. Saklar di daftar jadi "kecualikan".</div>
      </div>
      <button class="switch" id="swAll" role="switch" aria-checked="${S.all}"></button>
    </div>
    <div class="set">
      <div class="grow">
        <div>System-wide</div>
        <div class="d">Semua app ikut tanpa dipilih satu per satu. Perlu reboot.</div>
      </div>
      <button class="switch" id="swSys" role="switch" aria-checked="${S.sys}"></button>
    </div>
    <div class="set">
      <div class="grow"><div>Folder konfigurasi</div><div class="d mono">${esc(PKGDIR)}</div></div>
    </div>`);
}

function confirmAll() {
  showSheet(`
    <h2>Hook semua app?</h2>
    <p style="color:var(--text2);font-size:14px">
      Semua app, termasuk app sistem, akan di-hook. App di daftar "di-hook" sekarang
      jadi <b>dikecualikan</b>.
    </p>
    <div class="dialog-actions">
      <button class="btn" id="cNo">Batal</button>
      <button class="btn danger" id="cYes">Aktifkan</button>
    </div>`);
}

function confirmSys() {
  showSheet(`
    <h2>Aktifkan system-wide?</h2>
    <p style="color:var(--text2);font-size:14px">
      Lokasi palsu berlaku untuk semua app dan sistem. Perlu reboot.
      Bila bootloop, buat file <span class="mono">${esc(MODDIR)}/disable</span> lewat recovery/adb.
    </p>
    <div class="dialog-actions">
      <button class="btn" id="sNo">Batal</button>
      <button class="btn danger" id="sYes">Aktifkan</button>
    </div>`);
}

/* ------------------------------ Events ------------------------------- */
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  toggle(row.dataset.pkg);
});
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); }));
$('#chipSys').addEventListener('click', () => {
  S.showSys = !S.showSys;
  try { localStorage.setItem('gpsz_showsys', S.showSys ? '1' : '0'); } catch (e) {}
  render();
});
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#btnReload').addEventListener('click', load);
$('#banners').addEventListener('click', e => { if (e.target.closest('#btnReboot')) B.reboot().catch(err => toast('Gagal reboot: ' + err.message, true)); });
$('#btnApp').addEventListener('click', appAction);
$('#btnSpoof').addEventListener('click', async () => {
  if (S.spoofBusy || !S.spoofHas) return;
  const want = !S.spoofOn;
  S.spoofBusy = true; $('#btnSpoof').disabled = true; $('#btnSpoof').textContent = '…';
  try {
    await B.setSpoof(want);
    S.spoofBusy = false;
    renderStatus(await B.readCfg());
    toast(want ? 'Spoof dimulai' : 'Spoof dihentikan');
  } catch (e) {
    S.spoofBusy = false;
    renderStatus(await B.readCfg().catch(() => ''));
    toast('Gagal: ' + e.message, true);
  }
});
$('#btnSettings').addEventListener('click', openSheet);
$('#scrim').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', e => {
  const th = e.target.closest('[data-th]');
  if (th) { applyTheme(th.dataset.th); openSheet(); return; }
  if (e.target.closest('#swAll')) { S.all ? setAllMode(false) : confirmAll(); return; }
  if (e.target.closest('#swSys')) { S.sys ? setSysMode(false) : confirmSys(); return; }
  if (e.target.closest('#sNo')) { openSheet(); return; }
  if (e.target.closest('#sYes')) { setSysMode(true); return; }
  if (e.target.closest('#cNo')) { openSheet(); return; }
  if (e.target.closest('#cYes')) { setAllMode(true); }
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(theme())); } catch (e) {}
applyTheme(theme());
load();

// Status spoof di-refresh otomatis (dulu hanya dibaca sekali saat load, jadi basi setelah Start/Stop di app)
let _statusBusy = false;
async function refreshStatus() {
  if (_statusBusy || document.hidden || !hasKsu) return;
  _statusBusy = true;
  try { renderStatus(await B.readCfg()); } catch (e) { /* abaikan */ }
  _statusBusy = false;
}
document.addEventListener('visibilitychange', refreshStatus);
window.addEventListener('focus', refreshStatus);
setInterval(refreshStatus, 2500);
</script>
</body>
</html>
